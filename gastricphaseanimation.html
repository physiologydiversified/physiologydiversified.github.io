<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phases of Gastric Motility</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>

    body {
      font-family: 'Manrope', sans-serif;
      background-color: #f9f9fc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      color: #333;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 24px;
      color: #1e1b2e;
    }

    .video-container {
  position: relative;
  max-width: 900px;
  width: 100%;
}

video {
  width: 100%;
  max-height: 70vh; /* Limit video height to 60% of viewport */
  border-radius: 12px;
  object-fit: contain;
}

    .phase-controls {
      display: flex;
      justify-content: center;
      background: #5e3d9f;
      border-radius: 999px;
      margin-top: 8px;
      position: relative;
      z-index: 2;
      overflow: hidden;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    .phase-controls button {
      background: transparent;
      border: none;
      color: white;
      padding: 10px 18px;
      font-size: 0.95rem;
      cursor: pointer;
      position: relative;
      font-weight: 600;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .phase-controls button:hover,
    .phase-controls button:focus-visible {
      background-color: rgba(255, 255, 255, 0.1);
      outline: none;
    }

    .phase-controls button.active::after {
      content: "";
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      background: white;
      border-radius: 50%;
    }

    .phase-controls button[title] {
      position: relative;
    }

    .phase-controls button[title]:hover::after {
      content: attr(title);
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      white-space: nowrap;
      z-index: 10;
    }

    .speed-controls {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .caption {
      margin-top: 8px;
      font-size: 0.95rem;
      text-align: center;
      max-width: 700px;
      color: #555;
    }

    .wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  max-height: 100vh;
  overflow: hidden;
}

  </style>
</head>

<body>
    <div class="wrapper">

    
  <h1>Phases of Gastric Motility</h1>
  <div class="video-container">
    <video id="motilityVideo" controls>
      <source src="prototype/diagrams/GastricPhase_Video.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <div class="phase-controls">
      <button data-time="0" class="active" title="Triggered by thought, smell, or sight of food">Cephalic</button>
      <button data-time="10" title="Begins with food entry into the stomach">Gastric</button>
      <button data-time="20" title="Starts when chyme enters the intestine">Intestinal</button>
    </div>
  </div>

  <div class="speed-controls">
    <label for="speedSelect">Speed:</label>
    <select id="speedSelect">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
      <option value="1">1×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
      <option value="2">2×</option>
    </select>
  </div>

  <p class="caption" id="phaseCaption">
    Animation of the three phases of gastric motility with chyme movement visualization.
  </p>

  <script>
    const video = document.getElementById("motilityVideo");
    const phaseButtons = document.querySelectorAll(".phase-controls button");
    const caption = document.getElementById("phaseCaption");
    const captions = [
      "Cephalic phase: Initiated by the sight, smell, or thought of food, triggering salivation and vagal stimulation.",
      "Gastric phase: Triggered when food enters the stomach, causing stretch and chemical stimulation of gastric secretions.",
      "Intestinal phase: Begins when chyme enters the duodenum, regulating stomach emptying through feedback loops."
    ];

    phaseButtons.forEach((btn, i) => {
      btn.addEventListener("click", () => {
        phaseButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        video.currentTime = parseInt(btn.dataset.time);
        video.pause();
        caption.textContent = captions[i];
      });

      btn.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") {
          btn.click();
        }
      });
    });

    document.getElementById("speedSelect").addEventListener("change", function () {
      video.playbackRate = parseFloat(this.value);
    });
  </script>
</body>
</div>
      

</html>
